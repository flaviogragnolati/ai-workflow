schema_version: "1.0"

package:
  id: quasar-ai-delivery-skills
  description: "Coordinated skills for Quasar discovery, proposals, T3 delivery, QA, and optional reporting."
  stack_profile: t3-core
  compatibility: t3-only
  human_guide: README.md
  cross_workflow_contract: 00-cross-workflow-contract.md
  validator: scripts/validate-skills-package.py

workflows:
  discovery-proposal:
    status: active
    entry_skill: discovery-proposal-workflow
    stages: [proposal-discovery, commercial-proposal-design, interactive-web-proposal, commercial-proposal-document]
    optional_next: [ai-coding, reporting, close]
  ai-coding:
    status: active
    entry_skill: ai-coding-workflow
    planning_stages: [product-core-definition, technical-foundation-definition, domain-data-modeling, high-level-architecture-standards, module-feature-decomposition, backlog-and-delivery-planning]
    includes_execution_loop: true
    includes_integral_qa: true
    optional_next: [reporting, close]
  reporting:
    status: planned
    entry_skill: null
    current_tools: [generate-quasar-deck]

skills:
  ai-coding-workflow:
    path: app-flow/ai-coding-workflow
    status: active
    kind: orchestrator
    workflow: ai-coding
    stage: orchestration
    invocable: true
    execution_modes: [orchestrated]
    persistent_outputs:
      - {type: workflow-state, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: workflow-runtime}
      - {type: artifact-index, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: artifact-inventory}
      - {type: release-candidate, lifecycle: Baselined, creation_mode: authored, semantic_authority: canonical, authority_scope: release-candidate}
      - {type: integral-validation, lifecycle: Baselined, creation_mode: authored, semantic_authority: canonical, authority_scope: release-quality}
      - {type: delivery-manifest, lifecycle: Released, creation_mode: authored, semantic_authority: canonical, authority_scope: delivery}
    transient_outputs: [routing-plan, internal-delegation]
    side_effects: [write-project-state, write-artifact-index, write-project-artifacts]
    approval_policy: user-confirms-commercial-impact-priority-and-release
    fallback: stop-on-non-t3-or-return-blocked-stage-result
    stack_profile: t3-core
    contract_version: "1.0"

  backlog-and-delivery-planning:
    path: app-flow/backlog-and-delivery-planning
    status: active
    kind: stage
    workflow: ai-coding
    stage: backlog
    invocable: true
    execution_modes: [orchestrated, standalone]
    persistent_outputs:
      - {type: development-backlog, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: delivery-structure}
      - {type: backlog-changelog, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: structural-change-history}
      - {type: backlog-views, lifecycle: Working, creation_mode: derived, semantic_authority: none, authority_scope: presentation}
    transient_outputs: []
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-priority-and-structural-replanning
    fallback: standalone-without-global-state-update
    stack_profile: t3-core
    contract_version: "1.0"

  domain-data-modeling:
    path: app-flow/domain-data-modeling
    status: active
    kind: stage
    workflow: ai-coding
    stage: domain-data
    invocable: true
    execution_modes: [orchestrated, standalone]
    persistent_outputs:
      - {type: domain-model, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: domain-semantics}
      - {type: data-dictionary, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: entity-and-attribute-definitions}
      - {type: erd-mermaid, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: visual-representation}
      - {type: erd-render, lifecycle: Working, creation_mode: derived, semantic_authority: none, authority_scope: presentation}
    transient_outputs: []
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-domain-decisions-with-downstream-impact
    fallback: standalone-without-global-state-update
    stack_profile: t3-core
    contract_version: "1.0"

  high-level-architecture-standards:
