schema_version: "1.2"

package:
  id: quasar-ai-delivery-skills
  description: "Coordinated skills for Quasar project questions, engagement research, discovery, proposals, profile-driven software delivery, database schema design and review, QA, and optional reporting."
  stack_profile: project-defined
  compatibility: profile-driven
  human_guide: README.md
  cross_workflow_contract: skills/core/q-core-contract/SKILL.md
  validator: skills/scripts/validate-skills-package.py

workflows:
  discovery-proposal:
    status: active
    entry_skill: q-proposal-workflow
    stages: [q-proposal-discovery, q-proposal-design, q-proposal-web, q-proposal-document]
    delegates: [research, reporting]
    optional_next: [ai-coding, reporting, close]
  ai-coding:
    status: active
    entry_skill: q-delivery-workflow
    planning_stages: [q-plan-product-core, q-plan-tech-foundation, q-plan-domain-model, q-plan-architecture, q-plan-features, q-plan-backlog]
    includes_execution_loop: true
    includes_integral_qa: true
    delegates: [reporting]
    optional_next: [reporting, close]
  research:
    status: active
    entry_skill: q-research-workflow
    stages: [q-research-scope, q-research-investigate, q-research-synthesize]
    optional_next: [discovery-proposal, reporting, close]
  reporting:
    status: active
    entry_skill: q-report-workflow
    stages: [q-report-source]
    renderers: [q-report-document, q-report-deck]
    report_types: [progress, feature, milestone, release, completion, consulting, executive, custom]
    optional_next: [return-to-caller, close]
  maintenance:
    status: active
    entry_skill: q-maint-ai-workflow
    scope: package-administration

skills:
  q-core-contract:
    path: core/q-core-contract
    group: core
    requires: []
    status: active
    kind: tool
    workflow: shared
    stage: null
    invocable: false
    execution_modes: [internal]
    human_interaction: {internal: none}
    persistent_outputs: []
    transient_outputs: []
    side_effects: [none]
    approval_policy: read-only-governance-reference-with-no-project-or-package-writes
    fallback: report-the-missing-governance-reference-instead-of-assuming-shared-rules
    stack_profile: any
    contract_version: "1.1"
    distribution: public

  q-tool-mermaid:
    path: tool/q-tool-mermaid
    group: tool
    requires: [q-core-contract]
    status: active
    kind: tool
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: on-demand, standalone: on-demand}
    persistent_outputs:
      - {type: standalone-mermaid-source, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: visual-representation}
      - {type: standalone-mermaid-render, lifecycle: Working, creation_mode: derived, semantic_authority: none, authority_scope: presentation}
    transient_outputs: [diagram-request, validation-diagnostic, repair-log, render-preview]
    side_effects: [write-project-artifacts, execute-local-renderer]
    approval_policy: local-generation-within-authorized-paths-and-explicit-approval-for-overwrite-remote-render-or-publication
    fallback: return-source-and-explicit-validation-or-rendering-gap-without-false-success
    stack_profile: any
    contract_version: "1.1"
    distribution: public

  q-tool-database-schema:
    path: tool/q-tool-database-schema
    group: tool
    requires: [q-core-contract]
    status: active
    kind: tool
    workflow: ai-coding
    stage: null
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: on-demand, standalone: on-demand}
    persistent_outputs: []
    transient_outputs: [database-design-analysis, schema-review-findings, document-model-findings, migration-strategy, performance-diagnostic]
    side_effects: [none]
    approval_policy: read-only-no-database-connection-execution-code-write-or-project-state-change
    fallback: bounded-analysis-or-coverage-gap-with-owner-route
    stack_profile: project-defined
    contract_version: "1.0"
    distribution: public

  q-ask-project:
    path: ask/q-ask-project
    group: ask
    requires: [q-core-contract]
    status: active
    kind: tool
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [standalone]
    human_interaction: {standalone: on-demand}
    persistent_outputs: []
    transient_outputs: [project-answer, alignment-notes]
    side_effects: [network-read]
    approval_policy: read-only-no-project-artifact-state-or-external-write
    fallback: answer-with-explicit-scope-and-evidence-limitations
    stack_profile: any
    contract_version: "1.0"

  q-ask-analyze:
    path: ask/q-ask-analyze
    group: ask
    requires: [q-core-contract, q-ask-project]
    status: active
    kind: tool
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [standalone]
    human_interaction: {standalone: on-demand}
    persistent_outputs: []
    transient_outputs: [proposal-fit-analysis, alignment-notes, routing-recommendation]
    side_effects: [network-read]
    approval_policy: read-only-no-project-artifact-state-or-external-write
    fallback: conditional-or-undetermined-disposition-with-evidence-gaps
    stack_profile: any
    contract_version: "1.0"

  q-review-docs:
    path: review/q-review-docs
    group: review
    requires: [q-core-contract]
    uses:
      - skill: q-tool-mermaid
        when: durable-scope-contains-mermaid-that-needs-read-only-validation
        fallback: inspect-source-structure-manually-and-report-render-validation-as-unavailable
    status: active
    kind: quality
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: review-at-boundaries, standalone: review-at-boundaries}
    persistent_outputs: []
    transient_outputs: [documentation-diagnostic]
    side_effects: [none]
    approval_policy: read-only-no-source-state-index-or-external-changes
    fallback: explicit-durable-scope-with-coverage-limitations
    stack_profile: any
    contract_version: "1.0"

  q-review-skill:
    path: review/q-review-skill
    group: review
    requires: []
    status: active
    kind: quality
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [standalone]
    human_interaction: {standalone: review-at-boundaries}
    persistent_outputs: []
    transient_outputs: [skill-quality-diagnostic]
    side_effects: [network-read]
    approval_policy: read-only-no-target-package-or-external-write
    fallback: evidence-limited-diagnostic-with-unverified-spec-or-unreadable-resources
    stack_profile: any
    contract_version: "1.0"

  q-delivery-workflow:
    path: delivery/q-delivery-workflow
    group: delivery
    requires: [q-core-contract]
    uses:
      - skill: q-tool-database-schema
        when: user-requests-standalone-database-schema-migration-or-performance-analysis
        fallback: route-to-the-current-domain-architecture-refinement-debug-or-review-owner-with-database-capability-gap
    status: active
    kind: orchestrator
    workflow: ai-coding
    stage: orchestration
    invocable: true
    execution_modes: [orchestrated]
    human_interaction: {orchestrated: decision-gated}
    persistent_outputs:
      - {type: workflow-state, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: workflow-runtime}
      - {type: artifact-index, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: artifact-inventory}
      - {type: release-candidate, lifecycle: Baselined, creation_mode: authored, semantic_authority: canonical, authority_scope: release-candidate}
      - {type: integral-validation, lifecycle: Baselined, creation_mode: authored, semantic_authority: canonical, authority_scope: release-quality}
      - {type: delivery-manifest, lifecycle: Released, creation_mode: authored, semantic_authority: canonical, authority_scope: delivery}
    transient_outputs: [routing-plan, internal-delegation]
    side_effects: [write-project-state, write-artifact-index, write-project-artifacts]
    approval_policy: user-confirms-commercial-impact-priority-and-release
    fallback: block-on-unresolved-requirement-or-coverage-gap
    stack_profile: project-defined
    contract_version: "1.1"

  q-plan-backlog:
    path: plan/q-plan-backlog
    group: plan
    requires: [q-core-contract]
    uses:
      - skill: q-tool-mermaid
        when: approved-backlog-visual-intent-requires-a-derived-gantt-view
        fallback: continue-with-canonical-backlog-and-textual-derived-views
    status: active
    kind: stage
    workflow: ai-coding
    stage: backlog
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: decision-gated, standalone: decision-gated}
    persistent_outputs:
      - {type: development-backlog, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: delivery-structure}
      - {type: backlog-changelog, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: structural-change-history}
      - {type: backlog-views, lifecycle: Working, creation_mode: derived, semantic_authority: none, authority_scope: presentation}
    transient_outputs: []
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-priority-and-structural-replanning
    fallback: standalone-without-global-state-update
    stack_profile: any
    contract_version: "1.0"

  q-plan-domain-model:
    path: plan/q-plan-domain-model
    group: plan
    requires: [q-core-contract, q-tool-mermaid]
    uses:
      - skill: q-tool-database-schema
        when: existing-database-schema-or-material-confirmed-profile-needs-physical-persistence-assistance
        fallback: continue-with-persistence-neutral-domain-model-and-record-the-database-assistance-gap
    status: active
    kind: stage
    workflow: ai-coding
    stage: domain-data
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: decision-gated, standalone: decision-gated}
    persistent_outputs:
      - {type: domain-model, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: domain-semantics}
      - {type: data-dictionary, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: entity-and-attribute-definitions}
      - {type: erd-mermaid, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: visual-representation}
      - {type: erd-render, lifecycle: Working, creation_mode: derived, semantic_authority: none, authority_scope: presentation}
    transient_outputs: []
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-domain-decisions-with-downstream-impact
    fallback: standalone-without-global-state-update
    stack_profile: project-defined
    contract_version: "1.0"

  q-plan-architecture:
    path: plan/q-plan-architecture
    group: plan
    requires: [q-core-contract, q-tool-mermaid]
    uses:
      - skill: q-tool-database-schema
        when: confirmed-database-profile-needs-physical-design-or-migration-analysis
        fallback: continue-with-evidence-bounded-architecture-and-record-the-database-analysis-gap
    status: active
    kind: stage
    workflow: ai-coding
    stage: architecture
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: decision-gated, standalone: decision-gated}
    persistent_outputs:
      - {type: architecture-narrative, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: architecture}
      - {type: architecture-adrs, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: decisions}
      - {type: architecture-mermaid, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: visual-representation}
      - {type: architecture-render, lifecycle: Working, creation_mode: derived, semantic_authority: none, authority_scope: presentation}
    transient_outputs: []
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-architecture-decisions-with-scope-or-cost-impact
    fallback: standalone-without-global-state-update
    stack_profile: project-defined
    contract_version: "1.0"

  q-plan-features:
    path: plan/q-plan-features
    group: plan
    requires: [q-core-contract]
    uses:
      - skill: q-tool-mermaid
        when: approved-module-or-dependency-structure-benefits-from-a-diagram
        fallback: continue-with-canonical-module-feature-and-sequence-artifacts
    status: active
    kind: stage
    workflow: ai-coding
    stage: module-features
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: decision-gated, standalone: decision-gated}
    persistent_outputs:
      - {type: module-map, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: module-ownership}
      - {type: feature-index, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: feature-definition}
      - {type: technical-implementation-sequence, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: technical-ordering}
    transient_outputs: []
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-boundary-or-scope-changes
    fallback: standalone-without-global-state-update
    stack_profile: project-defined
    contract_version: "1.0"

  q-plan-product-core:
    path: plan/q-plan-product-core
    group: plan
    requires: [q-core-contract]
    status: active
    kind: stage
    workflow: ai-coding
    stage: product-core
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: decision-gated, standalone: decision-gated}
    persistent_outputs:
      - {type: product-core, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: product-intent-and-scope}
    transient_outputs: []
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-product-scope-and-unresolved-assumptions
    fallback: standalone-without-global-state-update
    stack_profile: any
    contract_version: "1.0"

  q-plan-tech-foundation:
    path: plan/q-plan-tech-foundation
    group: plan
    requires: [q-core-contract]
    status: active
    kind: stage
    workflow: ai-coding
    stage: technical-foundation
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: decision-gated, standalone: decision-gated}
    persistent_outputs:
      - {type: technical-foundation, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: stack-selection-versioned-guidance-nfr-and-operations}
    transient_outputs: [stack-options-analysis]
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-stack-and-architecture-driving-decisions
    fallback: requirements-driven-recommendation-or-explicit-coverage-gap
    stack_profile: project-defined
    contract_version: "1.0"

  q-review-codebase:
    path: review/q-review-codebase
    group: review
    requires: []
    uses:
      - skill: q-tool-database-schema
        when: audit-scope-includes-material-database-schema-document-model-migration-or-performance-risk
        fallback: continue-with-generic-and-project-grounded-database-coverage-and-name-the-specialist-gap
    status: active
    kind: quality
    workflow: ai-coding
    stage: integral-qa
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: review-at-boundaries, standalone: review-at-boundaries}
    persistent_outputs:
      - {type: codebase-audit, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: quality-assessment}
    transient_outputs: [review-notes]
    side_effects: [write-review-artifact, network-read]
    approval_policy: no-code-change-or-external-publication
    fallback: generic-review-with-explicit-stack-coverage-gaps
    stack_profile: project-defined
    contract_version: "1.0"

  q-review-code:
    path: review/q-review-code
    group: review
    requires: []
    uses:
      - skill: q-tool-database-schema
        when: changed-surface-includes-relational-schema-document-model-or-migration
        fallback: apply-project-and-generic-data-integrity-criteria-and-declare-specialist-coverage-unavailable
    status: active
    kind: quality
    workflow: ai-coding
    stage: mini-review
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: review-at-boundaries, standalone: review-at-boundaries}
    persistent_outputs: []
    transient_outputs: [standards-review, specification-review]
    side_effects: [none]
    approval_policy: read-only-unless-user-separately-authorizes-fixes
    fallback: sequential-two-axis-review
    stack_profile: project-defined
    contract_version: "1.0"

  q-code-debug:
    path: code/q-code-debug
    group: code
    requires: []
    uses:
      - skill: q-tool-database-schema
        when: database-performance-failure-has-supplied-query-plan-or-metric-evidence
        fallback: continue-with-evidence-led-debugging-and-mark-specialist-database-analysis-unavailable
    status: active
    kind: tool
    workflow: ai-coding
    stage: implementation
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: on-demand, standalone: on-demand}
    persistent_outputs: []
    transient_outputs: [hypotheses, reproduction-harness]
    side_effects: [write-code, write-tests]
    approval_policy: follow-requested-fix-scope-and-require-approval-for-external-effects
    fallback: report-missing-reproduction-or-project-tooling
    stack_profile: project-defined
    contract_version: "1.0"

  q-code-grill-design:
    path: code/q-code-grill-design
    group: code
    requires: []
    uses:
      - skill: q-tool-mermaid
        when: approved-feature-architecture-needs-a-structural-diagram
        fallback: continue-with-canonical-textual-design-and-record-the-visual-capability-gap
      - skill: q-tool-database-schema
        when: cross-cutting-change-has-material-physical-schema-or-migration-risk
        fallback: continue-with-owner-led-design-and-record-the-specialist-database-gap
    status: active
    kind: tool
    workflow: ai-coding
    stage: refinement
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: dialogue-led, standalone: dialogue-led}
    persistent_outputs:
      - {type: architecture-feature-design, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: feature-architecture}
    transient_outputs: [interview-notes]
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-major-tradeoffs-and-scope
    fallback: deescalate-to-q-code-grill-feature
    stack_profile: project-defined
    contract_version: "1.0"

  q-code-explain:
    path: code/q-code-explain
    group: code
    requires: []
    status: active
    kind: tool
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [standalone]
    human_interaction: {standalone: on-demand}
    persistent_outputs: []
    transient_outputs: [rephrased-explanation]
    side_effects: [none]
    approval_policy: read-only
    fallback: plain-language-summary
    stack_profile: any
    contract_version: "1.0"

  q-code-explore:
    path: code/q-code-explore
    group: code
    requires: [q-code-grill-design]
    uses:
      - skill: q-tool-mermaid
        when: user-requests-a-transient-code-structure-diagram
        fallback: return-the-evidence-grounded-textual-map-and-state-the-visual-capability-gap
    status: active
    kind: tool
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: on-demand, standalone: on-demand}
    persistent_outputs: []
    transient_outputs: [orientation-summary]
    side_effects: [none]
    approval_policy: read-only-and-no-artifact-creation
    fallback: report-scope-and-evidence-limitations
    stack_profile: any
    contract_version: "1.0"

  q-code-grill-feature:
    path: code/q-code-grill-feature
    group: code
    requires: []
    uses:
      - skill: q-tool-database-schema
        when: bounded-feature-has-material-physical-schema-or-migration-risk
        fallback: continue-with-repository-grounded-feature-planning-and-record-the-specialist-database-gap
    status: active
    kind: tool
    workflow: ai-coding
    stage: refinement
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: dialogue-led, standalone: dialogue-led}
    persistent_outputs:
      - {type: feature-implementation-plan, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: feature-execution}
    transient_outputs: [interview-notes]
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-feature-scope-and-approach
    fallback: escalate-or-deescalate-grill-depth
    stack_profile: project-defined
    contract_version: "1.0"

  q-code-handoff:
    path: code/q-code-handoff
    group: code
    requires: []
    status: active
    kind: tool
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [standalone]
    human_interaction: {standalone: on-demand}
    persistent_outputs:
      - {type: session-handoff, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: continuity}
    transient_outputs: []
    side_effects: [write-workspace-artifact]
    approval_policy: redact-secrets-and-stay-inside-workspace
    fallback: return-handoff-in-conversation
    stack_profile: any
    contract_version: "1.0"

  q-code-implement:
    path: code/q-code-implement
    group: code
    requires: []
    status: active
    kind: tool
    workflow: ai-coding
    stage: implementation
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: on-demand, standalone: on-demand}
    persistent_outputs: []
    transient_outputs: [internal-plan, scratchpad, internal-delegation]
    side_effects: [write-code, write-tests, update-original-execution-record]
    approval_policy: follow-authorized-scope-and-request-approval-for-external-effects
    fallback: stop-and-return-to-refinement
    stack_profile: project-defined
    contract_version: "1.0"

  q-code-implementation-plan:
    path: code/q-code-implementation-plan
    group: code
    requires: []
    uses:
      - skill: q-tool-database-schema
        when: settled-work-needs-engine-specific-schema-or-migration-sequencing
        fallback: continue-with-observed-repository-evidence-and-mark-the-specialist-database-gap
    status: active
    kind: tool
    workflow: ai-coding
    stage: refinement
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: decision-gated, standalone: decision-gated}
    persistent_outputs:
      - {type: implementation-plan, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: planned-execution}
    transient_outputs: [planning-notes]
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-scope-and-sequencing
    fallback: return-to-q-code-grill-design
    stack_profile: project-defined
    contract_version: "1.0"

  q-code-prototype:
    path: code/q-code-prototype
    group: code
    requires: []
    status: active
    kind: tool
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [standalone]
    human_interaction: {standalone: on-demand}
    persistent_outputs: []
    transient_outputs: [prototype]
    side_effects: [write-throwaway-artifacts]
    approval_policy: no-production-or-external-effects
    fallback: analysis-only
    stack_profile: any
    contract_version: "1.0"

  q-code-research:
    path: code/q-code-research
    group: code
    requires: [q-core-contract]
    status: active
    kind: tool
    workflow: shared
    stage: null
    invocable: true
    execution_modes: [orchestrated, standalone]
    human_interaction: {orchestrated: on-demand, standalone: on-demand}
    persistent_outputs:
