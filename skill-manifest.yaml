    execution_modes: [orchestrated, standalone]
    persistent_outputs:
      - {type: architecture-narrative, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: architecture}
      - {type: architecture-adrs, lifecycle: Working, creation_mode: authored, semantic_authority: canonical, authority_scope: decisions}
      - {type: architecture-mermaid, lifecycle: Working, creation_mode: authored, semantic_authority: supporting, authority_scope: visual-representation}
      - {type: architecture-render, lifecycle: Working, creation_mode: derived, semantic_authority: none, authority_scope: presentation}
    transient_outputs: []
    side_effects: [write-project-artifacts]
    approval_policy: user-confirms-architecture-decisions-with-scope-or-cost-impact
    fallback: standalone-without-global-state-update
    stack_profile: t3-core
    contract_version: "1.0"

