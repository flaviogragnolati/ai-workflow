$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar skill manifest
type: object
required: [schema_version, package, workflows, skills, planned_capabilities]
additionalProperties: false
properties:
  schema_version:
    const: "1.7"
  package:
    type: object
    required: [id, description, stack_profile, compatibility, human_guide, cross_workflow_contract, validator]
    properties:
      id: {type: string}
      description: {type: string}
      stack_profile: {enum: [project-defined, t3-core, any]}
      compatibility: {enum: [profile-driven, t3-only]}
      human_guide: {type: string}
      cross_workflow_contract: {type: string}
      validator: {type: string}
  workflows:
    type: object
    additionalProperties:
      type: object
      required: [status, entry_skill]
      properties:
        status: {enum: [active, planned, deprecated, archived]}
        entry_skill: {type: [string, "null"]}
        profiles:
          type: array
          items: {enum: [general, market]}
        content_profiles:
          type: array
          items: {enum: [general, market-research]}
        stage_conditions:
          type: object
          additionalProperties:
            type: object
            required: [when]
            additionalProperties: false
            properties:
              when: {type: string}
        delegates:
          type: array
          items: {type: string}
  skills:
    type: object
    additionalProperties:
      type: object
      required: [path, group, requires, status, kind, workflow, stage, invocable, execution_modes, human_interaction, persistent_outputs, transient_outputs, side_effects, approval_policy, fallback, stack_profile, contract_version]
      properties:
        path: {type: string}
        group: {enum: [proposal, delivery, plan, code, review, report, research, ideation, ask, tool, core, maint]}
        requires:
          type: array
          items: {type: string}
        uses:
          type: array
          items:
            type: object
            required: [skill, when, fallback]
            additionalProperties: false
            properties:
              skill: {type: string}
              when: {type: string}
              fallback: {type: string}
        status: {enum: [active, planned, deprecated, archived]}
        kind: {enum: [orchestrator, stage, tool, renderer, quality]}
        workflow: {type: string}
        stage: {type: [string, "null"]}
        invocable: {type: boolean}
        execution_modes:
          type: array
          minItems: 1
          items: {enum: [orchestrated, standalone, internal]}
        human_interaction:
          type: object
          additionalProperties: false
          properties:
            orchestrated: {enum: [dialogue-led, decision-gated, review-at-boundaries, on-demand, none]}
            standalone: {enum: [dialogue-led, decision-gated, review-at-boundaries, on-demand, none]}
            internal: {enum: [dialogue-led, decision-gated, review-at-boundaries, on-demand, none]}
        persistent_outputs:
          type: array
          items:
            type: object
            required: [type, lifecycle, creation_mode, semantic_authority, authority_scope]
            properties:
              type: {type: string}
              lifecycle: {enum: [Working, Baselined, Released, Superseded, Archived]}
              creation_mode: {enum: [authored, derived]}
              semantic_authority: {enum: [canonical, supporting, none]}
              authority_scope: {type: string}
        transient_outputs:
          type: array
          items: {type: string}
        side_effects:
          type: array
          minItems: 1
          items:
            enum:
              - none
              - execute-local-capability-probe
              - execute-local-renderer
              - execute-local-scripts
              - execute-local-validator
              - git-create-branch
              - git-create-worktree
              - git-stage
              - git-continue-operation
              - git-commit
              - git-push
              - git-delete-ref
              - network-read
              - update-original-execution-record
              - write-artifact-index
              - write-authorized-agent-artifacts
              - write-authorized-package-files
              - write-code
              - write-package-files
              - write-project-artifacts
              - write-project-state
              - write-review-artifact
              - write-tests
              - write-throwaway-artifacts
              - write-tracker-or-markdown-tickets
              - write-workspace-artifact
        approval_policy: {type: string}
        fallback: {type: string}
        stack_profile: {enum: [project-defined, t3-core, any]}
        contract_version: {enum: ["1.0", "1.1", "1.2", "1.3", "1.4", "2.0"]}
        distribution: {enum: [public, internal]}
  planned_capabilities:
    type: object
    additionalProperties:
      type: object
      required: [status, invocable]
      additionalProperties: false
      properties:
        status: {const: planned}
        invocable: {const: false}
