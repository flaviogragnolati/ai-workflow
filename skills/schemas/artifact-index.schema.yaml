$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar artifact index
type: object
required: [schema_version, project_id, artifacts]
additionalProperties: false
properties:
  schema_version: {const: "1.0"}
  project_id: {type: string}
  artifacts:
    type: array
    items:
      type: object
      required: [artifact_id, artifact_type, path, owner_workflow, owner_skill, creation_mode, semantic_authority, authority_scope, lifecycle, version, source_refs]
      properties:
        artifact_id: {type: string}
        artifact_type: {type: string}
        path: {type: string}
        owner_workflow: {type: string}
        owner_skill: {type: string}
        creation_mode: {enum: [authored, derived]}
        semantic_authority: {enum: [canonical, supporting, none]}
        authority_scope: {type: string}
        lifecycle: {enum: [Working, Baselined, Released, Superseded, Archived]}
        version: {type: string}
        source_refs:
          type: array
          items: {type: string}
        provenance:
          type: object
