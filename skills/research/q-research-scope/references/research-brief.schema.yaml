$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar research brief
type: object
required: [schema_version, brief, decision_refs, questions, scope, budget, search_plan, assumptions]
additionalProperties: false
properties:
  schema_version: {const: "1.0"}
  brief:
    type: object
    required: [brief_id, version, lifecycle, status, approval_ref]
    additionalProperties: false
    properties:
      brief_id: {type: string}
      version: {type: string}
      lifecycle: {const: Working}
      status: {enum: [draft, authorized]}
      approval_ref: {type: [string, "null"]}
  decision_refs:
    type: array
    minItems: 1
    items: {type: string}
  questions:
    type: array
    minItems: 1
    items:
      type: object
      required: [question_id, question, question_type, decision_refs, parent_question_ref, boundaries, radar]
      additionalProperties: false
      properties:
        question_id: {type: string}
        question: {type: string}
        question_type: {enum: [factual, comparative, market, regulatory, technology, feasibility]}
        decision_refs:
          type: array
          minItems: 1
          items: {type: string}
        parent_question_ref: {type: [string, "null"]}
        boundaries:
          type: array
          minItems: 1
          items: {type: string}
        radar:
          type: object
          required: [researchable, anchored, decision_linked, adds_evidence, relevant, average, passes]
          additionalProperties: false
          properties:
            researchable: {enum: [1, 2, 3, 4, 5]}
            anchored: {enum: [1, 2, 3, 4, 5]}
            decision_linked: {enum: [1, 2, 3, 4, 5]}
            adds_evidence: {enum: [1, 2, 3, 4, 5]}
            relevant: {enum: [1, 2, 3, 4, 5]}
            average: {type: number}
            passes: {type: boolean}
  scope:
    type: object
    required: [in_scope, out_of_scope, privacy_constraints]
    additionalProperties: false
    properties:
      in_scope:
        type: array
        minItems: 1
        items: {type: string}
      out_of_scope:
        type: array
        items: {type: string}
      privacy_constraints:
        type: array
        items: {type: string}
  budget:
    type: object
    required: [time_limit, cost_limit, stopping_conditions]
    additionalProperties: false
    properties:
      time_limit: {type: string}
      cost_limit: {type: string}
      stopping_conditions:
        type: array
        minItems: 1
        items: {type: string}
  search_plan:
    type: array
    minItems: 1
    items:
      type: object
      required: [question_ref, strategies, source_classes]
      additionalProperties: false
      properties:
        question_ref: {type: string}
        strategies:
          type: array
          minItems: 1
          items: {type: string}
        source_classes:
          type: array
          minItems: 1
          items: {type: string}
  assumptions:
    type: array
    items: {type: string}
